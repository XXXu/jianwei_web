services:
  web:
    build: .
    container_name: jianwei-web
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    command:
      - sh
      - -c
      - uv run alembic upgrade head && uv run python -m app.seed && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000

  nginx:
    image: nginx:1.27-alpine
    container_name: jianwei-nginx
    depends_on:
      - web
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
